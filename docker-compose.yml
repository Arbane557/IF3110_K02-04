services:
  backend:
    build: ./src/backend
    ports:
      - "6969:6969"
    environment:
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set a 64-character hexadecimal key}
      DATABASE_URL: postgres://app:secret@database:5432/app?sslmode=disable
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
