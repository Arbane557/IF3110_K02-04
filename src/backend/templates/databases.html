<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Databases</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="wide">
        <nav class="topbar">
            <a href="/databases">Databases</a>
            <a href="/migrations">Migrations</a>
            <a id="users-link" href="/auth" hidden>Users</a>
            <a id="groups-link" href="/groups" hidden>Groups</a>
            <span id="profile" class="profile">Loading profile...</span>
            <form method="post" action="/logout"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><button type="submit">Logout</button></form>
        </nav>

        <h1>Databases</h1>

        <section id="connection-section" hidden>
            <h2>Add database</h2>
            <form id="database-form" class="form-grid">
                <label>Name<input name="name" required maxlength="100" placeholder="Development"></label>
                <label>Host<input name="host" required></label>
                <label>Port<input name="port" type="number" min="1" max="65535" value="5432" required></label>
                <label>Database<input name="databaseName" required></label>
                <label>User<input name="username" required autocomplete="username"></label>
                <label>Password<input name="password" type="password" required autocomplete="new-password"></label>
                <label>SSL mode
                    <select name="sslMode" required>
                        <option value="disable">disable</option>
                        <option value="allow">allow</option>
                        <option value="prefer">prefer</option>
                        <option value="require" selected>require</option>
                        <option value="verify-ca">verify-ca</option>
                        <option value="verify-full">verify-full</option>
                    </select>
                </label>
                <div class="form-action"><button type="submit">Save</button></div>
            </form>
            <p id="form-status" class="status" role="status" aria-live="polite"></p>
        </section>

        <section>
            <h2>Saved databases</h2>
            <p id="list-status" class="status" role="status" aria-live="polite">Loading databases…</p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Name</th><th>ID</th><th>Access</th><th>Status</th></tr></thead>
                    <tbody id="database-list"></tbody>
                </table>
            </div>
        </section>

        <section id="viewer-section" hidden>
            <div class="viewer-heading">
                <div><h2>Schema graph</h2><p id="selected-database" class="status"></p></div>
                <label>Schema<select id="schema-select" disabled><option>Choose a database</option></select></label>
            </div>
            <p id="graph-status" class="status" role="status" aria-live="polite"></p>
            <div class="schema-graph-viewport"><div id="schema-graph" class="schema-graph">
                <svg id="graph-lines" aria-hidden="true"></svg>
                <div id="graph-nodes"></div>
            </div></div>

            <div id="table-details" hidden>
                <h3 id="table-heading">Table details</h3>
                <div class="viewer-grid">
                    <div>
                        <h4>Columns</h4>
                        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Type</th><th>Nullable</th><th>Default</th></tr></thead><tbody id="column-list"></tbody></table></div>
                    </div>
                    <div>
                        <h4>Constraints</h4>
                        <ul id="constraint-list" class="resource-list"></ul>
                        <h4>Indexes</h4>
                        <ul id="index-list" class="resource-list"></ul>
                    </div>
                </div>
                <h4>Data</h4>
                <p id="row-status" class="status" role="status"></p>
                <div class="table-wrap"><table><thead id="row-head"></thead><tbody id="row-list"></tbody></table></div>
                <div class="pager">
                    <button id="previous-page" type="button">Previous</button>
                    <span id="page-label"></span>
                    <button id="next-page" type="button">Next</button>
                </div>
            </div>
        </section>
    </main>
    <script>
        const form = document.querySelector("#database-form");
        const formStatus = document.querySelector("#form-status");
        const listStatus = document.querySelector("#list-status");
        const databaseList = document.querySelector("#database-list");
        const viewerSection = document.querySelector("#viewer-section");
        const selectedDatabase = document.querySelector("#selected-database");
        const schemaSelect = document.querySelector("#schema-select");
        const graphStatus = document.querySelector("#graph-status");
        const schemaGraph = document.querySelector("#schema-graph");
        const graphLines = document.querySelector("#graph-lines");
        const graphNodes = document.querySelector("#graph-nodes");
        const detailsSection = document.querySelector("#table-details");
        const tableHeading = document.querySelector("#table-heading");
        const columnList = document.querySelector("#column-list");
        const constraintList = document.querySelector("#constraint-list");
        const indexList = document.querySelector("#index-list");
        const rowStatus = document.querySelector("#row-status");
        const rowHead = document.querySelector("#row-head");
        const rowList = document.querySelector("#row-list");
        const previousPage = document.querySelector("#previous-page");
        const nextPage = document.querySelector("#next-page");
        const pageLabel = document.querySelector("#page-label");
        let currentRole = "USER";
        let selected = null;
        let selectedSchema = null;
        let selectedTable = null;
        let currentPage = 1;
        const pageSize = 50;

        async function requestJSON(url, options = {}) {
            const method = (options.method || "GET").toUpperCase();
            const headers = new Headers(options.headers || {});
            if (!["GET", "HEAD", "OPTIONS"].includes(method)) headers.set("X-CSRF-Token", document.querySelector('input[name="_csrf"]').value);
            const response = await fetch(url, { ...options, method, headers });
            const payload = response.status === 204 ? null : await response.json();
            if (!response.ok) throw new Error(payload?.error || `Request failed (${response.status})`);
            return payload;
        }

        async function loadDatabases() {
            try {
                const databases = await requestJSON("/api/databases");
                databaseList.replaceChildren();
                if (databases.length === 0) {
                    listStatus.textContent = document.body.dataset.admin === "true"
                        ? "No databases saved yet. Add a connection above."
                        : "No databases are assigned to your account yet.";
                    return;
                }
                listStatus.textContent = "";
                for (const database of databases) {
                    const row = document.createElement("tr");
                    const name = document.createElement("td");
                    const id = document.createElement("td");
                    const access = document.createElement("td");
                    const action = document.createElement("td");
                    name.textContent = database.name;
                    id.textContent = database.id;
                    access.textContent = currentRole === "ADMIN" ? "Platform admin" : "Group access";
                    if (currentRole === "ADMIN") {
                        const button = document.createElement("button");
                        button.type = "button";
                        button.textContent = "Connect";
                        button.addEventListener("click", async () => {
                            button.disabled = true;
                            button.textContent = "Connecting…";
                            try {
                                await requestJSON(`/api/databases/${database.id}/test-connection`, { method: "POST" });
                                button.textContent = "Connected";
                            } catch (error) {
                                button.textContent = "Retry";
                                listStatus.textContent = error.message;
                                button.disabled = false;
                            }
                        });
                        action.append(button);
                    }
                    const browse = document.createElement("button");
                    browse.type = "button";
                    browse.textContent = "Browse schema";
                    browse.addEventListener("click", () => openViewer(database));
                    action.append(browse);
                    row.append(name, id, access, action);
                    databaseList.append(row);
                }
            } catch (error) {
                listStatus.textContent = error.message;
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            formStatus.textContent = "Saving connection…";
            const values = Object.fromEntries(new FormData(form));
            values.port = Number(values.port);
            try {
                await requestJSON("/api/databases", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(values),
                });
                form.reset();
                form.elements.port.value = 5432;
                form.elements.sslMode.value = "require";
                formStatus.textContent = "Saved. Select Connect to test it.";
                await loadDatabases();
            } catch (error) {
                formStatus.textContent = error.message;
            }
        });

        async function openViewer(database) {
            selected = database;
            selectedSchema = null;
            selectedTable = null;
            currentPage = 1;
            viewerSection.hidden = false;
            selectedDatabase.textContent = `Database: ${database.name}`;
            schemaSelect.replaceChildren(new Option("Loading schemas...", ""));
            schemaSelect.disabled = true;
            graphNodes.replaceChildren();
            graphLines.replaceChildren();
            detailsSection.hidden = true;
            graphStatus.textContent = "Loading schemas...";
            try {
                const schemas = await requestJSON(`/api/databases/${database.id}/schemas`);
                schemaSelect.replaceChildren();
                for (const schema of schemas) {
                    schemaSelect.add(new Option(schema.name, schema.name));
                }
                schemaSelect.disabled = schemas.length === 0;
                if (!schemas.length) {
                    schemaSelect.add(new Option("No schemas", ""));
                    graphStatus.textContent = "No visible schemas.";
                    return;
                }
                schemaSelect.value = schemas[0].name;
                await loadSchemaGraph(schemaSelect.value);
            } catch (error) {
                graphStatus.textContent = error.message;
            }
        }

        schemaSelect.addEventListener("change", () => loadSchemaGraph(schemaSelect.value));

        async function loadSchemaGraph(schema) {
            selectedSchema = schema;
            selectedTable = null;
            detailsSection.hidden = true;
            graphNodes.replaceChildren();
            graphLines.replaceChildren();
            graphStatus.textContent = "Loading table relationships...";
            try {
                const tables = await requestJSON(`/api/databases/${selected.id}/schemas/${encodeURIComponent(schema)}/tables`);
                if (!tables.length) {
                    graphStatus.textContent = "No tables in this schema.";
                    schemaGraph.style.width = "100%";
                    schemaGraph.style.height = "120px";
                    return;
                }
                const nodes = await Promise.all(tables.map(async table => ({
                    ...table,
                    details: await requestJSON(`/api/databases/${selected.id}/schemas/${encodeURIComponent(schema)}/tables/${encodeURIComponent(table.name)}`),
                })));
                renderSchemaGraph(nodes);
                graphStatus.textContent = "";
            } catch (error) {
                graphStatus.textContent = error.message;
            }
        }

        function renderSchemaGraph(nodes) {
            graphNodes.replaceChildren();
            graphLines.replaceChildren();
            const byName = new Map(nodes.map(node => [node.name, node]));
            const edges = [];
            for (const node of nodes) {
                for (const constraint of node.details.constraints || []) {
                    if (constraint.type !== "FOREIGN KEY") continue;
                    const target = parseForeignKeyTarget(constraint.definition, selectedSchema);
                    if (target && target.schema === selectedSchema && byName.has(target.table)) {
                        edges.push({ from: target.table, to: node.name, label: constraint.name });
                    }
                }
            }

            const ranks = new Map(nodes.map(node => [node.name, 0]));
            for (let pass = 0; pass < nodes.length; pass++) {
                let changed = false;
                for (const edge of edges) {
                    const rank = Math.min(nodes.length - 1, ranks.get(edge.from) + 1);
                    if (rank > ranks.get(edge.to)) { ranks.set(edge.to, rank); changed = true; }
                }
                if (!changed) break;
            }
            const columns = new Map();
            for (const node of nodes) {
                const rank = ranks.get(node.name);
                if (!columns.has(rank)) columns.set(rank, []);
                columns.get(rank).push(node);
            }
            const cardWidth = 300, gapX = 150, gapY = 30, pad = 28;
            const positions = new Map();
            let graphHeight = 0;
            let graphWidth;
            if (edges.length === 0) {
                const gridColumns = Math.min(3, nodes.length);
                const rowHeights = [];
                nodes.sort((a, b) => a.name.localeCompare(b.name));
                nodes.forEach((node, index) => {
                    const row = Math.floor(index / gridColumns);
                    const height = 48 + Math.max(1, node.details.columns.length) * 27;
                    const y = pad + rowHeights.slice(0, row).reduce((sum, value) => sum + value + gapY, 0);
                    positions.set(node.name, { x: pad + (index % gridColumns) * (cardWidth + gapX), y, height });
                    rowHeights[row] = Math.max(rowHeights[row] || 0, height);
                });
                graphHeight = pad * 2 + rowHeights.reduce((sum, value) => sum + value + gapY, -gapY);
                graphWidth = pad * 2 + gridColumns * cardWidth + (gridColumns - 1) * gapX;
            } else {
                for (const [rank, column] of columns) {
                    column.sort((a, b) => a.name.localeCompare(b.name));
                    let y = pad;
                    for (const node of column) {
                        const height = 48 + Math.max(1, node.details.columns.length) * 27;
                        positions.set(node.name, { x: pad + rank * (cardWidth + gapX), y, height });
                        y += height + gapY;
                    }
                    graphHeight = Math.max(graphHeight, y);
                }
                graphWidth = pad * 2 + (Math.max(...columns.keys()) + 1) * (cardWidth + gapX) - gapX;
            }
            schemaGraph.style.width = `${Math.max(graphWidth, 700)}px`;
            schemaGraph.style.height = `${Math.max(graphHeight, 240)}px`;

            for (const node of nodes) {
                const position = positions.get(node.name);
                const card = document.createElement("button");
                card.type = "button";
                card.className = "schema-node";
                card.style.left = `${position.x}px`;
                card.style.top = `${position.y}px`;
                card.style.width = `${cardWidth}px`;
                card.addEventListener("click", () => loadTableDetails(node.name));
                const title = document.createElement("span");
                title.className = "schema-node-title";
                title.innerHTML = `<span>${escapeHTML(node.name)}</span><small>${escapeHTML(node.type.replaceAll("_", " "))}</small>`;
                card.append(title);
                for (const column of node.details.columns) {
                    const row = document.createElement("span");
                    row.className = "schema-node-column";
                    row.innerHTML = `<span>${escapeHTML(column.name)}</span><small>${escapeHTML(column.dataType)}</small>`;
                    card.append(row);
                }
                graphNodes.append(card);
            }
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
            marker.setAttribute("id", "graph-arrow"); marker.setAttribute("viewBox", "0 0 10 10");
            marker.setAttribute("refX", "9"); marker.setAttribute("refY", "5"); marker.setAttribute("markerWidth", "7"); marker.setAttribute("markerHeight", "7"); marker.setAttribute("orient", "auto-start-reverse");
            const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
            arrow.setAttribute("d", "M 0 0 L 10 5 L 0 10 z"); arrow.setAttribute("fill", "#777");
            marker.append(arrow); defs.append(marker); graphLines.append(defs);
            graphLines.setAttribute("width", graphWidth); graphLines.setAttribute("height", graphHeight);
            graphLines.setAttribute("viewBox", `0 0 ${graphWidth} ${graphHeight}`);
            for (const edge of edges) {
                const source = positions.get(edge.from), target = positions.get(edge.to);
                const x1 = source.x + cardWidth, y1 = source.y + source.height / 2;
                const x2 = target.x, y2 = target.y + target.height / 2;
                const bend = Math.max(55, Math.abs(x2 - x1) / 2);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`);
                path.setAttribute("class", "schema-edge"); path.setAttribute("marker-end", "url(#graph-arrow)");
                path.setAttribute("aria-label", edge.label); graphLines.append(path);
            }
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
        }

        function parseForeignKeyTarget(definition, defaultSchema) {
            const match = definition.match(/\bREFERENCES\s+(?:(?:"([^"]+)"|([\w$]+))\.)?(?:"([^"]+)"|([\w$]+))/i);
            if (!match) return null;
            return {
                schema: match[1] || match[2] || defaultSchema,
                table: (match[3] || match[4]).replaceAll('""', '"'),
            };
        }

        async function loadTableDetails(table) {
            selectedTable = table;
            currentPage = 1;
            detailsSection.hidden = false;
            tableHeading.textContent = `${selectedSchema}.${table}`;
            columnList.replaceChildren();
            constraintList.replaceChildren();
            indexList.replaceChildren();
            rowStatus.textContent = "Loading table details...";
            rowHead.replaceChildren();
            rowList.replaceChildren();
            const base = `/api/databases/${selected.id}/schemas/${encodeURIComponent(selectedSchema)}/tables/${encodeURIComponent(table)}`;
            try {
                const details = await requestJSON(base);
                for (const column of details.columns) {
                    const row = document.createElement("tr");
                    for (const value of [column.name, column.dataType, column.nullable ? "yes" : "no", column.default ?? ""]) {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.append(cell);
                    }
                    columnList.append(row);
                }
                renderDefinitionList(constraintList, details.constraints, value => `${value.name}: ${value.type} - ${value.definition}`);
                renderDefinitionList(indexList, details.indexes, value => `${value.name}: ${value.definition}`);
            } catch (error) {
                rowStatus.textContent = error.message;
                return;
            }
            try {
                await loadRows(base);
                rowStatus.textContent = "";
            } catch (error) {
                rowStatus.textContent = error.message === "Failed to fetch"
                    ? "Could not load table rows. Check the backend and database connection."
                    : error.message;
            }
        }

        async function loadRows(base) {
            const rows = await requestJSON(`${base}/rows?page=${currentPage}&pageSize=${pageSize}`);
            rowHead.replaceChildren();
            rowList.replaceChildren();
            const header = document.createElement("tr");
            for (const column of rows.columns) {
                const cell = document.createElement("th");
                cell.textContent = column;
                header.append(cell);
            }
            rowHead.append(header);
            for (const value of rows.rows) {
                const row = document.createElement("tr");
                for (const column of rows.columns) {
                    const cell = document.createElement("td");
                    cell.textContent = displayValue(value[column]);
                    row.append(cell);
                }
                rowList.append(row);
            }
            previousPage.disabled = currentPage <= 1;
            nextPage.disabled = rows.rows.length < pageSize;
            pageLabel.textContent = `Page ${currentPage}`;
        }

        function renderDefinitionList(list, values, formatter) {
            list.replaceChildren();
            if (!values.length) {
                const item = document.createElement("li");
                item.textContent = "None";
                list.append(item);
                return;
            }
            for (const value of values) {
                const item = document.createElement("li");
                item.textContent = formatter(value);
                list.append(item);
            }
        }

        function displayValue(value) {
            if (value === null || value === undefined) return "NULL";
            return typeof value === "object" ? JSON.stringify(value) : String(value);
        }

        function selectedTableBaseURL() {
            return `/api/databases/${selected.id}/schemas/${encodeURIComponent(selectedSchema)}/tables/${encodeURIComponent(selectedTable)}`;
        }

        previousPage.addEventListener("click", async () => {
            if (!selectedTable || currentPage <= 1) return;
            currentPage--;
            try {
                await loadRows(selectedTableBaseURL());
            } catch (error) {
                rowStatus.textContent = error.message;
            }
        });

        nextPage.addEventListener("click", async () => {
            if (!selectedTable) return;
            currentPage++;
            try {
                await loadRows(selectedTableBaseURL());
            } catch (error) {
                currentPage--;
                rowStatus.textContent = error.message;
            }
        });

        requestJSON("/whoami").then((user) => {
            currentRole = user.role;
            document.querySelector("#profile").textContent = `Signed in: ${user.username} (${user.role})`;
            document.body.dataset.admin = String(currentRole === "ADMIN");
            document.querySelector("#connection-section").hidden = currentRole !== "ADMIN";
            document.querySelector("#users-link").hidden = currentRole !== "ADMIN";
            document.querySelector("#groups-link").hidden = currentRole !== "ADMIN";
            return loadDatabases();
        }).catch((error) => {
            listStatus.textContent = error.message;
        });
    </script>
</body>
</html>
