<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrations</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="wide">
        <nav class="topbar">
            <a href="/databases">Databases</a>
            <form method="post" action="/logout"><button type="submit">Logout</button></form>
        </nav>

        <h1>Migrations</h1>
        <section>
            <label for="database-select">Database</label>
            <select id="database-select" disabled>
                <option>Loading databases...</option>
            </select>
            <p id="migration-status" class="status" role="status" aria-live="polite"></p>
        </section>

        <section>
            <h2>History</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Version</th><th>Name</th><th>Applied</th><th>Status</th></tr></thead>
                    <tbody id="migration-list">
                        <tr><td colspan="4">Migration history is not connected yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        const databaseSelect = document.querySelector("#database-select");
        const migrationStatus = document.querySelector("#migration-status");

        async function loadDatabases() {
            try {
                const response = await fetch("/api/databases");
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || `Request failed (${response.status})`);

                databaseSelect.replaceChildren();
                if (result.length === 0) {
                    databaseSelect.add(new Option("No databases available", ""));
                    migrationStatus.textContent = "No database is available to your role.";
                    return;
                }

                databaseSelect.add(new Option("Select a database", ""));
                for (const database of result) {
                    databaseSelect.add(new Option(database.name, database.id));
                }
                databaseSelect.disabled = false;
                migrationStatus.textContent = "Migration history is not connected yet.";
            } catch (error) {
                databaseSelect.replaceChildren(new Option("Could not load databases", ""));
                migrationStatus.textContent = error.message;
            }
        }

        loadDatabases();
    </script>
</body>
</html>
